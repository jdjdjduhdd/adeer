zerops:
  - setup: node
    run:
      base: docker@latest

      prepareCommands:
        - docker pull ghcr.io/pasarguard/node:v0.5.7

      start: docker run --rm --network=host --cap-add=NET_ADMIN -e API_KEY -e NODE_HOST -e SERVICE_PORT -e SERVICE_PROTOCOL -e SSL_CERT_FILE -e SSL_KEY_FILE -e GENERATED_CONFIG_PATH -v /var/lib/pg-node:/var/lib/pg-node ghcr.io/pasarguard/node:v0.5.7

      ports:
        - port: 62050
          protocol: TCP
        - port: 51820
          protocol: UDP
